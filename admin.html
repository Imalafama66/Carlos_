<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel — IMALAFAMA66</title><link rel="stylesheet" href="admin.css"></head><body><div class="layout"><aside><b>IMALAFAMA66</b><small>PANEL DE EDICIÓN</small><button class="tab active" data-t="general">General</button><button class="tab" data-t="services">Servicios y precios</button><button class="tab" data-t="projects">Trabajos / Portfolio</button><button class="tab" data-t="reviews">Reseñas</button><button class="tab" data-t="orders">Ventas / Pedidos</button><button class="tab" data-t="stats">Estadísticas</button><button class="tab" data-t="backup">Respaldo</button><a class="back" href="index.html">← Ver tienda</a></aside><main><header><div><h1>Panel de control</h1><p>Edita tu tienda sin tocar el código.</p></div></header><section id="general" class="panel active"></section><section id="services" class="panel"><div class="bar"><h2>Servicios y precios</h2><button class="btn" id="addService">+ Nuevo servicio</button></div><div id="serviceList"></div></section><section id="projects" class="panel"><div class="bar"><h2>Trabajos / Portfolio</h2><button class="btn" id="addProject">+ Nuevo trabajo</button></div><div id="projectList"></div></section><section id="reviews" class="panel"><div class="bar"><h2>Reseñas</h2><button class="btn" id="addReview">+ Nueva reseña</button></div><div id="reviewList"></div></section><section id="orders" class="panel"><div class="bar"><h2>Ventas / Pedidos</h2><button class="btn" id="addOrder">+ Nuevo pedido</button></div><div id="orderList"></div></section><section id="stats" class="panel"><div class="box"><h2>Estadísticas</h2><div id="statList"></div><button class="btn" id="saveStats">Guardar</button></div></section><section id="backup" class="panel"><div class="box"><h2>Respaldo</h2><p>Exporta la configuración para guardarla o moverla a otro dispositivo.</p><button class="btn" id="export">Exportar JSON</button> <input id="file" type="file" accept=".json"><button class="btn dark" id="import">Importar JSON</button><button class="btn danger" id="reset">Restaurar todo</button></div></section></main></div><div id="toast"></div><script src="config.js"></script><script src="admin.js"></script></body></html>
